name: atlas

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie

    environment:
      POSTGRES_DB: atlas_compose_db
      POSTGRES_USER: atlas_compose_user
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD:?Database password is required}

    volumes:
      - atlas_pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15


  backend:
    build:
      context: ./backend

    env_file:
      - ./.env.compose

    environment:
      DATABASE_URL: postgresql+psycopg://atlas_compose_user@db:5432/atlas_compose_db
      DB_PASSWORD: ${ATLAS_DB_PASSWORD:?Database password is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret is required}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HF_HOME: /home/atlas/.cache/huggingface
      ATLAS_STORAGE_ROOT: /app/storage

    volumes:
      - atlas_uploads:/app/storage
      - atlas_hf_cache:/home/atlas/.cache/huggingface

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api

    ports:
      - "127.0.0.1:8088:8080"

    depends_on:
      - backend


volumes:
  atlas_pgdata:
  atlas_uploads:
  atlas_hf_cache:
