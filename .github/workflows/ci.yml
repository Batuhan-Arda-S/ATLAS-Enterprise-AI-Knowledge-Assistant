name: ATLAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: atlas_ci_db
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d atlas_ci_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+psycopg://atlas_ci:atlas_ci_password@127.0.0.1:5432/atlas_ci_db
      JWT_SECRET_KEY: atlas_ci_only_test_secret_not_for_production
      JWT_ALGORITHM: HS256

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -r requirements-dev.txt

      - name: Enable pgvector
        working-directory: .
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U atlas_ci -d atlas_ci_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify pgvector and migration head
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.database.connection import DATABASE_URL

          with create_engine(DATABASE_URL).connect() as connection:
              assert connection.scalar(text("SELECT extname FROM pg_extension WHERE extname = 'vector'")) == "vector"
              assert connection.scalar(text("SELECT version_num FROM alembic_version")) == "c49f5e82a731"
          PY

      - name: Run backend tests
        run: python -m pytest -q test

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
